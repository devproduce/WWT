services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.ci
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-256-bit-secret-key-please-use-32b!!}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@weworktogether.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-ChangeMe_Admin1!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WeWorkTogether}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "8088:80"
    depends_on:
      - backend
