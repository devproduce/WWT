spring:
  application:
    name: weworktogether
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/weworktogether}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-please-use-32b!!}
    access-token-minutes: 15
    refresh-token-days: 14
  superadmin:
    email: ${SUPERADMIN_EMAIL:superadmin@weworktogether.local}
    password: ${SUPERADMIN_PASSWORD:ChangeMe_Admin1!}
    name: ${SUPERADMIN_NAME:Platform Owner}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,https://weworktogether.me,https://www.weworktogether.me}
  storage:
    dir: ${STORAGE_DIR:./uploads}
    max-file-bytes: ${MAX_FILE_BYTES:10485760}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from-name: ${MAIL_FROM_NAME:WeWorkTogether}
  contact:
    to: ${CONTACT_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{userId}] %logger{36} - %msg%n"
